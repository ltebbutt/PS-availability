# PS5 Pro stock alert - retailer list
#
# Kinds of check (type):
#   product  -> a single product page, checked for availability using the page's
#               structured data (schema.org "InStock"), a clickable add-to-basket
#               button, and out-of-stock wording.
#   search   -> a search or category page. Every PS5 Pro console link on it is
#               found and then checked like a product page, so new listings and
#               bundles are picked up automatically.
#   tracker  -> a stock-tracker site (Stock Goblin) that already watches many
#               retailers - including ones that block GitHub, like Currys and
#               GAME. Each retailer row on it becomes its own alert, but a direct
#               check of the same product always overrides it.
#
# engine: how the page is fetched. Different sites block different scrapers, so
# each entry uses the one that got through in the diagnose/ workflow runs:
#   chromium (default) | firefox | webkit_iphone | camoufox | curl_ios |
#   curl_chrome | jina | translate
#
# Other optional keys:
#   max_links:          how many matching links to follow from a search page (default 4)
#   link_pattern:       regex a product link's URL must match (to skip adverts etc.)
#   price_selector:     CSS selector for the price when the page has no structured data
#   require_text:       only count as in stock if this text is also on the page
#   setup:              one-off session setup (amazon_uk_postcode)
#   exclude_retailers:  for trackers - rows to ignore (resale marketplaces)
#   enabled:            false to skip the entry

settings:
  # Ignore listings outside this price range (GBP). The max filters out
  # scalper/marketplace prices (RRP is £789.99, bundles a bit higher); the min
  # filters out accessories that mention "PS5 Pro". Set to 0 to disable either.
  min_price: 400
  max_price: 900
  # A link/product title must match this to count as a PS5 Pro console.
  title_pattern: '(ps5|playstation\s*(®|&reg;)?\s*5)\s*(™|&trade;)?\s*pro\b'
  # ...and must NOT match this (accessories, games, covers, etc.)
  exclude_pattern: '\b(cover|covers|faceplate|plate|skin|skins|stand|case|charg\w*|cooling|headset|cable|sticker|decal|bag|mount|dock|compatible|for ps5 pro|for playstation 5 pro|enhanced|guide|ssd|memory card|vertical|renewed|refurbished|pre-owned|good as new)\b'
  # Send a reminder if something is still in stock after this many hours.
  remind_after_hours: 6
  # Page load timeout (seconds) and how long to let anti-bot JS challenges run.
  timeout: 45
  challenge_wait: 20
  # "virtual" runs Camoufox with a visible window on a virtual display (needs
  # Xvfb; the workflow runs under xvfb-run). It gets past Smyths' Incapsula,
  # which blocks every headless browser.
  camoufox_headless: virtual
  # UK delivery postcode for Amazon, so it shows UK availability.
  postcode: SW1A 1AA

retailers:
  # ---------------- Stock tracker (covers Currys, GAME, ShopTo, Amazon) ----------------
  # StockInformer was removed on 12 Oct 2026: it reported Box, GAME and Currys
  # in stock when none of them were.

  - name: Stock Goblin
    type: tracker
    url: https://www.stockgoblin.co.uk/products/playstation-5-pro-console
    engine: curl_chrome
    # Stock Goblin itself warns its EE data is currently wrong; EE is checked directly below.
    exclude_retailers: [StockX, eBay, EE]

  # ---------------- Amazon ----------------
  - name: Amazon UK
    type: product
    url: https://www.amazon.co.uk/dp/B0DJH2NS6R
    engine: camoufox
    setup: amazon_uk_postcode
    price_selector: '#corePrice_feature_div .a-offscreen, #corePriceDisplay_desktop_feature_div .a-offscreen, #apex_desktop .a-offscreen'

  # Through Google Translate's proxy Amazon loads but shows US availability.
  - name: Amazon UK
    type: product
    url: https://www.amazon.co.uk/dp/B0DM8SFRJV
    engine: translate
    enabled: false
    price_selector: '#corePrice_feature_div .a-offscreen, #corePriceDisplay_desktop_feature_div .a-offscreen, #apex_desktop .a-offscreen'

  # ---------------- Argos (also Sainsbury's) ----------------
  # Akamai blocks most scrapers; these two engines got real pages back once.
  - name: Argos (also Sainsbury's)
    type: product
    url: https://www.argos.co.uk/product/4350000
    engine: webkit_iphone

  - name: Argos (also Sainsbury's)
    type: product
    url: https://www.argos.co.uk/product/4440006
    engine: camoufox

  # ---------------- Currys ----------------
  # Cloudflare blocked every method from GitHub's servers; covered by the trackers.
  - name: Currys
    type: product
    url: https://www.currys.co.uk/products/sony-playstation-5-pro-10272138.html
    enabled: false

  # ---------------- Smyths ----------------
  - name: Smyths Toys
    type: product
    url: https://www.smythstoys.com/uk/en-gb/gaming-and-tech/playstation-5/playstation-5-consoles/playstation-5-pro-console-2tb-digital-edition-slim/p/244166
    engine: camoufox

  - name: Smyths Toys
    type: search
    url: https://www.smythstoys.com/uk/en-gb/search/?text=playstation%205%20pro%20console
    link_pattern: '/p/\d+'
    engine: camoufox

  # ---------------- Very / Littlewoods ----------------
  - name: Very
    type: product
    url: https://www.very.co.uk/playstation-5-pro-console/1601081144.prd
    engine: webkit_iphone

  - name: Very
    type: product
    url: https://www.very.co.uk/playstation-playstationreg5-pro-console-2tb-with-grand-theft-auto-v-amp-disc-drive/1601238401.prd
    engine: curl_ios

  - name: Littlewoods
    type: product
    url: https://www.littlewoods.com/playstation-5-pro-console/1601081144.prd
    engine: webkit_iphone

  # ---------------- John Lewis ----------------
  - name: John Lewis
    type: search
    url: https://www.johnlewis.com/search?search-term=playstation%205%20pro%20console
    link_pattern: '/p\d+'
    engine: firefox

  # ---------------- GAME ----------------
  # GAME answers 404 to non-UK visitors (GitHub's servers are in the US); covered by the trackers.
  - name: GAME
    type: search
    url: https://www.game.co.uk/en/playstation/consoles/ps5/
    engine: camoufox
    enabled: false

  # ---------------- PlayStation Direct ----------------
  - name: PlayStation Direct
    type: search
    url: https://direct.playstation.com/en-gb/hardware/ps5
    link_pattern: '/buy-consoles/'

  # ---------------- Supermarkets ----------------
  # Tesco and Asda don't currently sell the console online, but are checked in case.
  - name: Tesco
    type: search
    url: https://www.tesco.com/groceries/en-GB/search?query=playstation%205%20pro%20console
    link_pattern: '/products/'
    engine: firefox

  - name: Asda
    type: search
    url: https://www.asda.com/groceries/search/playstation%205%20pro
    engine: firefox

  - name: Costco UK
    type: search
    url: https://www.costco.co.uk/search?text=playstation%205%20pro
    link_pattern: '/p/'

  # ---------------- Online specialists ----------------
  - name: EE
    type: search
    url: https://shop.ee.co.uk/search?q=playstation%205%20pro

  - name: Ebuyer
    type: search
    url: https://www.ebuyer.com/searchresults?descriptionfilter=playstation+5+pro
    engine: firefox

  - name: Scan
    type: search
    url: https://www.scan.co.uk/search?q=playstation+5+pro+console
    link_pattern: '/products/'
    engine: jina

  # ShopTo shows "Not available in your country" to GitHub's US servers; covered by the trackers.
  - name: ShopTo
    type: product
    url: https://www.shopto.net/en/ps5hw93-playstation5-pro-console-p1182475/
    engine: firefox
    enabled: false

  - name: Box
    type: product
    url: https://box.co.uk/p5hehwsny59577-sony-playstation-5-pro-console
    engine: firefox

  # AO (Cloudflare) and Hughes blocked every method; AO doesn't list the console.
  - name: AO.com
    type: search
    url: https://ao.com/l/search/101/99/?search=playstation%205%20pro
    enabled: false
