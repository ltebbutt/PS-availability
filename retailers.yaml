# PS5 Pro stock alert - retailer list
#
# Two kinds of check:
#   type: product  -> a single product page. Checked for availability using the
#                     page's structured data (schema.org "InStock") and
#                     add-to-basket / out-of-stock wording.
#   type: search   -> a search or category page. Every PS5 Pro console link on it
#                     is found and then checked like a product page, so new
#                     listings and bundles are picked up automatically.
#
# Optional per-retailer keys:
#   max_links:     how many matching links to follow from a search page (default 6)
#   require_text:  only count as in stock if this text is also on the product page
#                  (e.g. "sold by amazon" to ignore marketplace scalpers)
#   link_pattern:  regex a product link's URL must match (to skip adverts, etc.)
#   enabled:       false to skip the entry

settings:
  # Ignore listings outside this price range (GBP). The max filters out
  # scalper/marketplace prices (RRP is £789.99, bundles a bit higher); the min
  # filters out accessories that mention "PS5 Pro". Set to 0 to disable either.
  min_price: 400
  max_price: 900
  # A link/product title must match this to count as a PS5 Pro console.
  title_pattern: '(ps5|playstation\s*(®|&reg;)?\s*5)\s*(™|&trade;)?\s*pro\b'
  # ...and must NOT match this (accessories, games, covers, etc.)
  exclude_pattern: '\b(cover|covers|faceplate|plate|skin|skins|stand|case|charg\w*|cooling|headset|cable|sticker|decal|bag|mount|dock|compatible|for ps5 pro|for playstation 5 pro|enhanced|guide|ssd|memory card|vertical)\b'
  # Send a reminder if something is still in stock after this many hours.
  remind_after_hours: 6
  # Page load timeout (seconds)
  timeout: 45

retailers:
  # ---------------- Amazon ----------------
  - name: Amazon UK
    type: search
    url: https://www.amazon.co.uk/s?k=playstation+5+pro+console&i=videogames
    link_pattern: '/dp/[A-Z0-9]{10}'
    require_text: 'amazon'
    max_links: 5

  # ---------------- Big electrical / toy retailers ----------------
